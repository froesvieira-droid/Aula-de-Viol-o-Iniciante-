<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e140d" />
      <stop offset="50%" stop-color="#2d1b0f" />
      <stop offset="100%" stop-color="#120c08" />
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e08a3c" />
      <stop offset="40%" stop-color="#c46215" />
      <stop offset="80%" stop-color="#8f3a09" />
      <stop offset="100%" stop-color="#5a2204" />
    </linearGradient>
    <linearGradient id="rosette" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d69f" />
      <stop offset="50%" stop-color="#9a5a1e" />
      <stop offset="100%" stop-color="#f5d69f" />
    </linearGradient>
    <radialGradient id="hole" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#050302" />
      <stop offset="85%" stop-color="#1a0f07" />
      <stop offset="100%" stop-color="#3d210f" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Subtle glow ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#e08a3c" stroke-opacity="0.15" stroke-width="2" />

  <!-- Guitar Body Shape (Acoustic Guitar Silhouette) -->
  <g filter="url(#glow)">
    <!-- Body -->
    <path d="M 256,120 
             C 210,120 170,145 170,185 
             C 170,225 195,245 190,265 
             C 180,305 145,335 145,380 
             C 145,435 195,475 256,475 
             C 317,475 367,435 367,380 
             C 367,335 332,305 322,265 
             C 317,245 342,225 342,185 
             C 342,145 302,120 256,120 Z" 
          fill="url(#wood)" stroke="#ffab53" stroke-width="3" stroke-opacity="0.4"/>

    <!-- Neck Extending upward -->
    <rect x="238" y="24" width="36" height="150" rx="3" fill="#3a1e0b" stroke="#603314" stroke-width="2"/>
    
    <!-- Frets on neck -->
    <line x1="238" y1="50" x2="274" y2="50" stroke="#d5b27e" stroke-width="2"/>
    <line x1="238" y1="75" x2="274" y2="75" stroke="#d5b27e" stroke-width="2"/>
    <line x1="238" y1="105" x2="274" y2="105" stroke="#d5b27e" stroke-width="2"/>
    <line x1="238" y1="140" x2="274" y2="140" stroke="#d5b27e" stroke-width="2"/>

    <!-- Fret Markers (dots) -->
    <circle cx="256" cy="62" r="2.5" fill="#fdf0d5"/>
    <circle cx="256" cy="90" r="2.5" fill="#fdf0d5"/>
    <circle cx="256" cy="122" r="2.5" fill="#fdf0d5"/>

    <!-- Sound Hole Outer Decorative Ring -->
    <circle cx="256" cy="225" r="46" fill="none" stroke="url(#rosette)" stroke-width="5"/>
    <circle cx="256" cy="225" r="50" fill="none" stroke="#2a1608" stroke-width="1.5"/>
    
    <!-- Sound Hole -->
    <circle cx="256" cy="225" r="40" fill="url(#hole)"/>

    <!-- Bridge -->
    <rect x="220" y="370" width="72" height="18" rx="5" fill="#201007" stroke="#4a2612" stroke-width="1.5"/>
    <rect x="228" y="375" width="56" height="4" rx="2" fill="#fff4e0"/>

    <!-- 6 Guitar Strings with golden shimmer -->
    <line x1="243" y1="30" x2="243" y2="375" stroke="#ffd9a6" stroke-width="1.2" stroke-opacity="0.8"/>
    <line x1="248" y1="30" x2="248" y2="375" stroke="#ffebb8" stroke-width="1.4" stroke-opacity="0.85"/>
    <line x1="253" y1="30" x2="253" y2="375" stroke="#fff8dc" stroke-width="1.6" stroke-opacity="0.9"/>
    <line x1="259" y1="30" x2="259" y2="375" stroke="#ffebb8" stroke-width="1.8" stroke-opacity="0.9"/>
    <line x1="264" y1="30" x2="264" y2="375" stroke="#ffd9a6" stroke-width="2.1" stroke-opacity="0.95"/>
    <line x1="269" y1="30" x2="269" y2="375" stroke="#f6c285" stroke-width="2.4" stroke-opacity="0.95"/>
  </g>

  <!-- Musical rhythm waves & notes accents -->
  <path d="M 120,230 Q 150,210 180,230" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <path d="M 332,230 Q 362,250 392,230" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.75"/>

  <!-- Musical note icons -->
  <g fill="#fcd34d" opacity="0.85">
    <circle cx="115" cy="180" r="7"/>
    <rect x="120" y="150" width="3" height="30"/>
    <path d="M 123,150 C 135,152 140,165 137,172" fill="none" stroke="#fcd34d" stroke-width="3" stroke-linecap="round"/>

    <circle cx="395" cy="170" r="7"/>
    <rect x="400" y="140" width="3" height="30"/>
    <path d="M 403,140 C 415,142 420,155 417,162" fill="none" stroke="#fcd34d" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
